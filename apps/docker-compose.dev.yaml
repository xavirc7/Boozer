# Use together with docker-compose.yaml; the backend keeps its existing container.
services:
  frontend:
    build:
      dockerfile: Dockerfile.dev
    environment:
      BOOZER_DOCKER_POLLING: "true"
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./ui-boozer:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
